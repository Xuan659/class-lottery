<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一番賞・班級抽籤</title><style>
:root{--red:#ac2631;--gold:#bd9346;--ink:#3b2926;--paper:#fffaf0}*{box-sizing:border-box}body{margin:0;background:#f5efe3;background-image:radial-gradient(#b9965522 1px,transparent 1px);background-size:12px 12px;color:var(--ink);font-family:"Microsoft JhengHei",sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible{outline:3px solid #257dad;outline-offset:4px}button:disabled{cursor:default;opacity:.5}header{background:var(--red);color:var(--paper);text-align:center;padding:32px 16px 28px;border-bottom:6px solid var(--gold)}header small{letter-spacing:5px;color:#f1d69a}h1{font-family:serif;font-size:clamp(32px,5vw,52px);letter-spacing:6px;margin:12px 0}header p{margin:0;color:#ffe7cf}main{max-width:1200px;margin:auto;padding:24px}.panel{background:var(--paper);border:1px solid #d9c6a1;border-radius:14px;padding:22px;box-shadow:0 8px 24px #61402608}.controls{display:flex;align-items:end;gap:14px;flex-wrap:wrap}label{display:grid;gap:8px;font-size:14px;font-weight:bold}input{width:110px;background:white;border:1px solid #cbb58d;border-radius:7px;padding:11px;font-size:20px;color:var(--ink)}.btn{padding:13px 20px;border-radius:7px;background:var(--red);color:white;font-weight:bold}.secondary{background:#eadfc9;color:#583c2e}.auto{margin-left:auto;display:flex;gap:10px;align-items:end}.stats{display:flex;gap:22px;flex-wrap:wrap;margin:22px 0;font-size:16px}.stats strong{font-size:28px;color:var(--red);margin:0 5px}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px}h2{font-family:serif;letter-spacing:2px;font-size:23px}.hint{color:#806b57;font-size:14px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px;padding:12px 0 24px}.ticket{position:relative;min-height:106px;background:var(--red);color:#fff4dc;border:5px double #dab773;box-shadow:2px 5px 0 #d7c8ae;transition:transform .15s;overflow:hidden}.ticket:not(:disabled):hover{transform:translateY(-5px) rotate(-2deg)}.ticket:before{content:"";position:absolute;left:0;right:0;top:22px;border-top:1px dashed #e7c888}.ticket span{display:block;font-size:23px;font-family:serif;letter-spacing:3px;padding-top:17px}.ticket small{font-size:10px;letter-spacing:2px}.ticket.used{background:#e7ddc9;color:#7d6953;border-color:#c9b993;box-shadow:none;opacity:1}.record{display:flex;gap:10px;flex-wrap:wrap}.chip{background:#fff;border:1px solid #d6bc85;border-radius:8px;padding:10px 16px;color:var(--red);font-size:24px;font-weight:bold}.chip small{display:block;font-size:11px;font-weight:normal;color:#8e7962}#message{min-height:24px;color:var(--red);margin:14px 0 0}dialog{border:1px solid var(--gold);border-radius:18px;background:var(--paper);padding:28px;width:min(640px,94vw);text-align:center;overflow:hidden;color:var(--ink);box-shadow:0 25px 100px #0005}dialog::backdrop{background:#241613c9;backdrop-filter:blur(5px)}.stage{position:relative;height:260px;margin:24px 0;isolation:isolate;perspective:1000px}.result{position:absolute;inset:0;background:#fff9e8;border:4px double var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:7px}.result strong{font-size:94px;color:var(--red);line-height:1.2}.result span{letter-spacing:8px;color:#957138}.cover{position:absolute;inset:0;z-index:2;filter:drop-shadow(0 7px 5px #0003)}.half{position:absolute;left:0;right:0;height:54%;background:var(--red);color:#fbe6b6;display:flex;align-items:center;justify-content:center;flex-direction:column;border:3px solid var(--gold);backface-visibility:hidden}.top{top:0;clip-path:polygon(0 0,100% 0,100% 94%,96% 100%,92% 94%,88% 100%,84% 94%,80% 100%,76% 94%,72% 100%,68% 94%,64% 100%,60% 94%,56% 100%,52% 94%,48% 100%,44% 94%,40% 100%,36% 94%,32% 100%,28% 94%,24% 100%,20% 94%,16% 100%,12% 94%,8% 100%,4% 94%,0 100%)}.bottom{bottom:0;clip-path:polygon(0 6%,4% 0,8% 6%,12% 0,16% 6%,20% 0,24% 6%,28% 0,32% 6%,36% 0,40% 6%,44% 0,48% 6%,52% 0,56% 6%,60% 0,64% 6%,68% 0,72% 6%,76% 0,80% 6%,84% 0,88% 6%,92% 0,96% 6%,100% 0,100% 100%,0 100%)}.top b{font-family:serif;font-size:38px;letter-spacing:8px}.bottom b{letter-spacing:8px;font-size:22px}.seam{position:absolute;z-index:3;top:50%;left:5%;right:5%;border-top:2px dashed #ffe4a9}.seam:after{content:"✂ 沿線撕開";background:var(--red);position:relative;top:-13px;padding:0 15px;color:#ffe4a9;font-size:14px}.tearing .top{animation:tearTop 1.15s ease-in forwards}.tearing .bottom{animation:tearBottom 1.15s ease-in forwards}.tearing .seam{opacity:0}.opened .cover{visibility:hidden}@keyframes tearTop{0%{transform:translate(0,0)}20%{transform:translate(-6px,-4px) rotate(-2deg)}35%{transform:translate(5px,-8px) rotate(2deg)}60%{transform:translate(-30px,-35px) rotate(-9deg)}100%{transform:translate(-140px,-250px) rotate(-28deg);opacity:0}}@keyframes tearBottom{0%{transform:translate(0,0)}25%{transform:translate(4px,3px)}60%{transform:translate(30px,35px) rotate(8deg)}100%{transform:translate(150px,250px) rotate(25deg);opacity:0}}#tear{min-width:180px;font-size:22px}#close{margin-left:10px}footer{text-align:center;padding:26px;color:#8b765c;font-size:12px}@media(max-width:650px){main{padding:14px}.auto{margin-left:0;width:100%;border-top:1px solid #ddcbae;padding-top:15px}.controls{gap:10px}.grid{grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:12px}.heading{display:block}dialog{padding:18px}.stage{height:230px}}@media(prefers-reduced-motion:reduce){.tearing .top,.tearing .bottom{animation-duration:.3s}.ticket{transition:none}}

/* The torn edge advances from the left edge to the right edge. */
@property --tear-x{syntax:'<percentage>';inherits:true;initial-value:-5%}
.tearing .top,.tearing .bottom{animation:none}
.tearing .cover{animation:tearAcross 1.6s linear forwards;clip-path:polygon(var(--tear-x) 0,100% 0,100% 100%,var(--tear-x) 100%,calc(var(--tear-x) + 2%) 94%,var(--tear-x) 88%,calc(var(--tear-x) + 1.5%) 82%,var(--tear-x) 76%,calc(var(--tear-x) + 2.5%) 69%,var(--tear-x) 62%,calc(var(--tear-x) + 1.5%) 55%,var(--tear-x) 48%,calc(var(--tear-x) + 2%) 41%,var(--tear-x) 34%,calc(var(--tear-x) + 1.5%) 27%,var(--tear-x) 20%,calc(var(--tear-x) + 2.5%) 13%,var(--tear-x) 6%)}
.tearing .cover:after{content:'';position:absolute;z-index:4;top:0;bottom:0;left:var(--tear-x);width:28px;background:linear-gradient(90deg,#ffedbc,#fff8e8 35%,#b48c48 55%,transparent);filter:drop-shadow(-5px 2px 4px #34231266);transform:skewY(-7deg)}
.seam:after{content:'✂ 由左向右撕開 →'}
@keyframes tearAcross{0%{--tear-x:-5%}15%{--tear-x:8%}35%{--tear-x:30%}55%{--tear-x:53%}75%{--tear-x:76%}100%{--tear-x:105%}}
@media(prefers-reduced-motion:reduce){.tearing .cover{animation-duration:.3s}}

.result{overflow:hidden;background-color:#fff5da;background-image:radial-gradient(circle at 50% 50%,#fffdf3 0 28%,transparent 29%),repeating-conic-gradient(from 0deg at 50% 50%,#e9c66b55 0deg 12deg,#fff5da 12deg 24deg)}
.result:before{content:'';position:absolute;inset:12px;border:1px solid #c9a359;border-radius:50%;opacity:.6;pointer-events:none}
.result span,.result strong{position:relative;text-shadow:0 2px 0 #fff7dc}
#coverResult{margin:8px 0}#tear{margin:8px 0}
[hidden]{display:none!important}
</style></head><body><header><small>每一張籤，都有一份期待</small><h1>一番賞・班級抽籤</h1><p>選一張好運，親手撕開驚喜。</p></header><main><section class="panel" aria-label="老師設定"><div class="controls"><label>總籤數（1～1000）<input id="total" type="number" min="1" max="1000" step="1" value="28"></label><button class="btn" id="apply">套用總數</button><button class="btn secondary" id="reset">重新洗牌</button><button class="btn secondary" id="coverAll">全部蓋回重抽</button><div class="auto"><label>自動抽出人數<input id="count" type="number" min="1" step="1" value="3"></label><button class="btn" id="auto">開始自動抽籤</button></div></div><p class="hint">修改總數後，按「套用總數」重新產生 1～N 號籤。「全部蓋回重抽」會蓋回所有籤、清除紀錄並重新隨機排列；總籤數維持不變。套用與重新洗牌也會清除本輪紀錄。</p><p id="message" role="status" aria-live="polite"></p></section><div class="stats"><span>總籤數 <strong id="n"></strong>張</span><span>剩餘 <strong id="left"></strong>張</span><span>已抽 <strong id="drawn"></strong>張</span></div><section><div class="heading"><h2>抽選券箱</h2><span class="hint">① 選一張籤　→　② 點擊「撕開」　→　③ 揭曉座號</span></div><div class="grid" id="grid"></div></section><section class="panel"><h2>本輪抽籤紀錄</h2><p class="hint">依抽出順序排列；同一輪座號不會重複。</p><div class="record" id="record" aria-live="polite"></div></section></main><footer>一番賞抽選會 · 無需登入 · 可離線使用</footer><dialog id="modal" aria-labelledby="modalTitle"><p class="hint" id="progress">手動抽籤</p><h2 id="modalTitle">你的抽選券，準備好了！</h2><div class="stage" id="stage"><div class="result" id="result" hidden></div><div class="cover"><div class="half top"><small>抽 選 券</small><b>一番賞</b></div><div class="half bottom"><b>抽 選 券</b><p>好運就在這張籤裡</p></div><div class="seam"></div></div></div><p id="instruction" aria-live="polite">座號尚未揭曉，點擊下方按鈕，由左向右撕開籤紙。</p><button class="btn" id="tear">由左向右撕開 →</button><button class="btn secondary" id="coverResult" hidden>全部蓋回重抽</button><button class="btn secondary" id="close">放回籤箱</button></dialog><script>
'use strict';
const $=id=>document.getElementById(id), ui={};
['total','count','apply','reset','coverAll','auto','n','left','drawn','grid','record','message','modal','progress','modalTitle','stage','result','instruction','tear','close','coverResult'].forEach(id=>ui[id]=$(id));
let tickets=[],history=[],selected=null,phase='idle',queue=[],batchSize=0,returnFocus=null;
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function randomInt(max){const a=new Uint32Array(1),limit=Math.floor(4294967296/max)*max;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%max}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=randomInt(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function tell(s){ui.message.textContent=s}
function render(){ui.n.textContent=tickets.length;ui.left.textContent=tickets.length-history.length;ui.drawn.textContent=history.length;ui.count.max=tickets.length-history.length;ui.grid.replaceChildren();tickets.forEach((t,i)=>{const b=document.createElement('button');b.className='ticket'+(t.used?' used':'');b.disabled=t.used||phase!=='idle';b.setAttribute('aria-label',t.used?`已抽出 ${t.value} 號`:`選擇第 ${i+1} 張抽選券`);const small=document.createElement('small'),span=document.createElement('span');small.textContent=t.used?'已揭曉':'抽選券';span.textContent=t.used?`${t.value} 號`:'一番賞';b.append(small,span);b.onclick=()=>openTicket(i,false);ui.grid.append(b)});ui.record.replaceChildren();if(!history.length)ui.record.textContent='還沒有抽籤紀錄，來選第一張吧！';history.forEach((v,i)=>{const chip=document.createElement('div');chip.className='chip';chip.textContent=`${v} 號`;const s=document.createElement('small');s.textContent=`第 ${i+1} 抽`;chip.append(s);ui.record.append(chip)});[ui.total,ui.count,ui.apply,ui.reset,ui.coverAll].forEach(el=>el.disabled=phase!=='idle');ui.auto.disabled=phase!=='idle'||history.length===tickets.length}
function reset(n){tickets=shuffle(Array.from({length:n},(_,i)=>({value:i+1,used:false})));history=[];queue=[];selected=null;phase='idle';render();tell(`已產生 1～${n} 號籤，開始選籤吧！`)}
function confirmReset(){return !history.length||confirm('確定開始新一輪？本輪抽籤紀錄將清除。')}
ui.apply.onclick=()=>{const n=Number(ui.total.value);if(!Number.isInteger(n)||n<1||n>1000){tell('請輸入 1～1000 的整數總籤數。');ui.total.focus();return}if(confirmReset())reset(n)};
ui.reset.onclick=()=>{if(confirmReset()){ui.total.value=tickets.length;reset(tickets.length)}};
function coverAll(){if(phase==='tearing'||batchSize)return;if(ui.modal.open)ui.modal.close();const n=tickets.length;ui.total.value=n;reset(n);tell('已全部蓋回並重新洗牌！所有座號都可以重新抽取。');ui.coverAll.focus()}
ui.coverAll.onclick=coverAll;
ui.coverResult.onclick=coverAll;
function openTicket(i,automatic){ui.coverResult.hidden=true;selected=i;phase='sealed';returnFocus=document.activeElement;ui.stage.className='stage';ui.result.replaceChildren();ui.result.hidden=true;ui.progress.textContent=automatic?`自動抽籤・第 ${batchSize-queue.length} / ${batchSize} 張`:'手動抽籤';ui.modalTitle.textContent='你的抽選券，準備好了！';ui.instruction.textContent=automatic?'即將自動撕開抽選券…':'座號尚未揭曉，點擊下方按鈕撕開籤紙。';ui.tear.hidden=automatic;ui.tear.disabled=false;ui.close.hidden=automatic;ui.close.textContent='放回籤箱';render();if(!ui.modal.open)ui.modal.showModal();if(!automatic)ui.tear.focus()}
async function tear(){
 if(phase!=='sealed')return;
 phase='tearing';ui.tear.disabled=true;ui.close.hidden=true;ui.coverResult.hidden=true;
 ui.modalTitle.textContent='由左向右，撕開好運！';ui.instruction.textContent='正由左向右撕開抽選券…';
 const t=tickets[selected],label=document.createElement('span'),number=document.createElement('strong');
 label.textContent='抽 中 座 號';number.textContent=t.value;
 ui.result.replaceChildren(label,number);ui.result.hidden=false;ui.result.setAttribute('aria-hidden','true');
 // The number is underneath the opaque paper, revealed by the moving torn edge.
 ui.stage.classList.add('tearing');
 await delay(matchMedia('(prefers-reduced-motion: reduce)').matches?350:1650);
 t.used=true;history.push(t.value);ui.stage.className='stage opened';ui.result.setAttribute('aria-hidden','false');
 ui.modalTitle.textContent='座號揭曉！';ui.instruction.textContent=`抽中 ${t.value} 號！`;
 phase='revealed';render();ui.tear.hidden=true;
 if(!batchSize){ui.close.hidden=false;ui.coverResult.hidden=false;ui.close.textContent='收下結果，繼續抽籤';ui.close.focus()}
}
ui.tear.onclick=tear;
function closeModal(){if(phase==='tearing'||batchSize)return;ui.modal.close();phase='idle';selected=null;render();tell(history.length===tickets.length?'本輪已全部抽完！可按「重新洗牌」開始新一輪。':'可以繼續選下一張籤。');if(returnFocus&&returnFocus.isConnected&&!returnFocus.disabled)returnFocus.focus();else ui.reset.focus()}
ui.close.onclick=closeModal;ui.modal.addEventListener('cancel',e=>{e.preventDefault();closeModal()});
ui.auto.onclick=async()=>{if(phase!=='idle')return;const c=Number(ui.count.value),remaining=tickets.length-history.length;if(!Number.isInteger(c)||c<1||c>remaining){tell(`請輸入 1～${remaining} 的整數抽出人數。`);ui.count.focus();return}queue=shuffle(tickets.map((t,i)=>t.used?null:i).filter(i=>i!==null)).slice(0,c);batchSize=c;const results=[];while(queue.length){const i=queue.shift();openTicket(i,true);await delay(650);await tear();results.push(tickets[i].value);await delay(850)}batchSize=0;phase='revealed';ui.coverResult.hidden=false;ui.progress.textContent=`本次自動抽出 ${c} 人`;ui.modalTitle.textContent='本次抽籤完成';ui.instruction.textContent=`本次座號：${results.join('、')} 號`;ui.close.textContent='收下結果，繼續抽籤';ui.close.hidden=false;ui.close.focus();tell(`本次抽出：${results.join('、')} 號。`)};
reset(28);
</script></body></html>
